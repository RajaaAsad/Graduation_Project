[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitecraft-website-builder"
version = "1.0.0"
description = "A guided Streamlit application for AI-assisted static website design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "openai>=1.68,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.17,<0.18"]
ml = ["transformers>=4.40,<5", "torch>=2.2,<3", "sentencepiece>=0.2,<1"]

[tool.setuptools.packages.find]
include = ["website_builder*"]

[tool.setuptools.package-data]
website_builder = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
